name: Publish v0.3.9

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Publish v0.3.9 draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ID="$(gh api "repos/${{ github.repository }}/releases" --paginate             --jq '.[] | select(.tag_name=="v0.3.9") | .id' | head -n1)"
          if [ -z "$ID" ]; then
            echo "::error::v0.3.9 release not found"
            exit 1
          fi
          gh api --method PATCH "repos/${{ github.repository }}/releases/$ID"             -F draft=false             -F prerelease=false >/dev/null
          echo "Published v0.3.9"
