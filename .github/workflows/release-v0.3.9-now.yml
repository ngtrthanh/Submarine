name: Build Windows portable now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.3.9-now.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Windows portable workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run windows.yml \
            --repo ${{ github.repository }} \
            --ref main
