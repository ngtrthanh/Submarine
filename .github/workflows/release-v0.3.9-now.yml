name: Release v0.3.9 now
# one-shot dispatcher retry after Android optional-signing fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.3.9-now.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml             --repo ${{ github.repository }}             --ref main             -f version=v0.3.9             -f publish_release=true
