name: Windows build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'package*.json'
      - '*.config.*'
      - 'index.html'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-full-ssh
      - name: Check Perl for vendored OpenSSL
        shell: pwsh
        run: |
          if (Test-Path 'C:\Strawberry\perl\bin\perl.exe') {
            'C:\Strawberry\perl\bin' | Out-File -FilePath $env:GITHUB_PATH -Append
            & 'C:\Strawberry\perl\bin\perl.exe' -v
          } else {
            perl -v
          }
      - run: npm ci
      - name: Build Windows installer
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --features full-ssh-algos --bundles nsis
      - name: Stage installer and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe artifacts/
          "Source commit: $env:GITHUB_SHA" | Set-Content artifacts/BUILD.txt
          Get-ChildItem artifacts/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content artifacts/SHA256SUMS.txt
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Submarine-Windows-x64-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
